spring.application.name=travel_recommendation
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
# API 키는 실행 환경에서만 주입한다. 기본 프로필도 키가 있으면 문장 분석을 사용할 수 있다.
# PC마다 환경변수 이름이 달라 앞에서부터 처음 설정된 값을 쓴다: OPENAI_API_KEY → OPEN_AI_API → Portfolio_java_API
travel.openai.api-key=${OPENAI_API_KEY:${OPEN_AI_API:${Portfolio_java_API:}}}
travel.openai.model=${OPENAI_MODEL:gpt-6-luna}
travel.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
travel.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
# 지도 화면용 카카오 JavaScript 키. 브라우저에 노출되는 키이므로 카카오 콘솔에서 사이트 도메인을 제한해 둔다.
travel.kakao.javascript-key=${KAKAO_JAVASCRIPT_KEY:}
travel.tourapi.service-key=${TOUR_API_SERVICE_KEY:}
# AI 확인 검색(반려동물 동반·여행 목적 활동) 자동 실행 여부. false면 초안 화면의 버튼으로만 찾는다. 시연 때 true로 바꾼다.
travel.verification.auto=${VERIFY_AUTO:false}
# TAGO 시외버스정보는 공공데이터포털에서 별도로 활용신청해야 한다. 키는 TourAPI와 같은 계정 키를 쓸 수 있다.
travel.tago.service-key=${TAGO_SERVICE_KEY:${TOUR_API_SERVICE_KEY:}}
server.servlet.session.timeout=30m
# CSS·JS 파일 이름에 내용 해시를 붙여(app-abc123.css) 고친 뒤 브라우저가 옛 파일을 계속 쓰지 않게 한다. Thymeleaf의 @{} 링크가 자동으로 바뀐다.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# 배포(HTTPS)에서는 SESSION_COOKIE_SECURE=true로 세션 쿠키를 HTTPS 연결에서만 보낸다. 로컬 http 실행은 기본값 false로 지금처럼 쓴다.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Database auto-configuration is enabled with either SQL Server profile.

#---
spring.config.activate.on-profile=!sqlserver & !sqlserver-windows
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
