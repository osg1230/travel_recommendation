<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 비회원 추천·초안은 브라우저 세션에만 연결된다. 세션이 끝나면 다시 열 수 없다는 것을 미리 알린다. -->
<p class="notice" th:fragment="notice" th:unless="${loggedIn}"
   th:text="${'비회원으로 만든 추천과 일정 초안은 ' + @navigationAdvice.guestSessionMinutes() + '분 동안 아무 동작이 없거나 브라우저를 닫으면 다시 열 수 없어요. 저장하려면 그 전에 로그인해 주세요.'}"></p>
<!-- 만료·권한 없음으로 결과를 열지 못했을 때 비회원에게 이유를 짐작할 수 있게 한다. -->
<p class="help" th:fragment="expired" th:unless="${loggedIn}"
   th:text="${'비회원으로 만든 결과였다면 ' + @navigationAdvice.guestSessionMinutes() + '분 넘게 아무 동작이 없어 세션이 끝났을 수 있어요. 여행 조건부터 다시 만들어 주세요.'}"></p>
</body>
</html>
