<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 모든 화면이 같은 머리말과 상단 바를 쓰도록 공통 조각으로 둔다. -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">다녀올게</title>
    <!-- 아이콘을 알려 주지 않으면 브라우저가 /favicon.ico를 찾다가 로그인 회원에게 403 기록이 남는다. 상단 바 로고와 같은 그림이다. -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <!-- 글꼴 Pretendard(CDN). CSS 안 @import로 부르면 app.css를 다 받은 뒤에야 받기 시작해 늦으므로 여기서 함께 받는다. 받지 못하면 맑은 고딕으로 보인다. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- 상단 바의 메뉴는 로그인 여부와 관리자 권한에 따라 달라진다. -->
<header th:fragment="header" class="site-header">
    <a class="brand" th:href="@{/}" aria-label="다녀올게 처음 화면">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="9" fill="currentColor"/>
            <path d="M8 22c3.5 0 4-6 8-6s4.5 4 8 4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="11" cy="10.5" r="2.6" fill="#fff"/>
        </svg>
        <span>다녀올게</span>
    </a>
    <!-- 좁은 화면에서는 메뉴를 접는다. 스크립트가 없으면 버튼은 숨고 메뉴가 그대로 보인다. -->
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>메뉴</button>
    <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
        <a th:href="@{/travel/conditions}">여행 계획</a>
        <th:block th:if="${loggedIn}">
            <!-- 추천 이력은 내 일정과 헷갈리기 쉬워 상단 메뉴에서 빼고 마이페이지 메뉴·홈 바로가기에서만 연다. -->
            <a th:href="@{/my/itineraries}">내 일정</a>
            <a th:href="@{/my/favorites}">즐겨찾기</a>
            <a th:href="@{/account}">내 정보</a>
            <a th:if="${admin}" th:href="@{/admin/members}">회원 관리</a>
            <a th:if="${admin}" th:href="@{/admin/keywords}">키워드 관리</a>
            <span class="nav-user" th:if="${loginId != null and !#strings.isEmpty(loginId)}" th:text="${loginId + '님'}" th:title="${loginId}"></span>
            <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
        </th:block>
        <th:block th:unless="${loggedIn}">
            <a th:href="@{/login}">로그인</a>
            <a class="nav-primary" th:if="${signupEnabled}" th:href="@{/signup}">회원가입</a>
        </th:block>
    </nav>
    <script defer th:src="@{/js/site-nav.js}"></script>
</header>
<!-- 여행 준비 단계 표시(설계서의 단계 표시). current는 1~5이며 지난 단계와 현재 단계를 구분한다. -->
<nav th:fragment="flowSteps(current)" class="flow-steps" aria-label="여행 준비 단계">
    <ol th:with="step=${current > 2 ? current - 1 : 1}">
        <li th:each="label, st : ${ {'여행 입력','여행지 추천','장소 확인','일정 만들기'} }"
            th:classappend="${st.count < step ? 'done' : (st.count == step ? 'current' : '')}"
            th:attr="aria-current=${st.count == step ? 'step' : null}">
            <span class="flow-num" th:text="${st.count}"></span><span class="flow-label" th:text="${label}"></span>
        </li>
    </ol>
</nav>
<!-- 마이페이지 공통 메뉴. 설계서의 마이페이지 메뉴를 화면 폭에 맞춰 탭으로 보여 준다. -->
<nav th:fragment="myNav(current)" class="my-nav" aria-label="마이페이지 메뉴">
    <a th:href="@{/account}" th:classappend="${current == 'account' ? 'active' : ''}" th:attr="aria-current=${current == 'account' ? 'page' : null}">내 정보</a>
    <a th:href="@{/my/itineraries}" th:classappend="${current == 'itineraries' ? 'active' : ''}" th:attr="aria-current=${current == 'itineraries' ? 'page' : null}">저장한 일정</a>
    <a th:href="@{/my/recommendations}" th:classappend="${current == 'recommendations' ? 'active' : ''}" th:attr="aria-current=${current == 'recommendations' ? 'page' : null}">추천 이력</a>
    <a th:href="@{/my/favorites}" th:classappend="${current == 'favorites' ? 'active' : ''}" th:attr="aria-current=${current == 'favorites' ? 'page' : null}">즐겨찾기</a>
    <a th:href="@{/my/ratings}" th:classappend="${current == 'ratings' ? 'active' : ''}" th:attr="aria-current=${current == 'ratings' ? 'page' : null}">내 평가</a>
    <a th:href="@{/my/ratings/browse}" th:classappend="${current == 'ratings-browse' ? 'active' : ''}" th:attr="aria-current=${current == 'ratings-browse' ? 'page' : null}">평가 둘러보기</a>
    <a th:href="@{/my/reservations}" th:classappend="${current == 'reservations' ? 'active' : ''}" th:attr="aria-current=${current == 'reservations' ? 'page' : null}">예약</a>
</nav>
</body>
</html>
