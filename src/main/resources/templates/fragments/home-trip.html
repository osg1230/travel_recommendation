<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 집 출발·귀가 입력(여행 정보 화면과 하루 시간 화면에서 같이 쓴다). home은 ItineraryController.HomeValues다.
       출발·귀가 시각과 편도 이동시간은 입력받지 않는다. 시각은 09:00 출발·20:00 도착으로 정하고 이동시간은 자동으로 찾는다. */-->
<section th:fragment="fields(home)" class="condition-section" data-home-trip>
<h2>집에서 출발하고 돌아오기</h2>
<p><label for="origin">출발지 (선택, 적거나 '내 위치로 찾기')</label>
<input id="origin" name="origin" maxlength="60" placeholder="예) 서울 송파구, 대전역, 수원시 영통동" th:value="${home.origin}"></p>
<!--/* 회원이 내 정보에 적은 '주로 출발하는 곳'을 미리 넣었으면 알리고, 적지 않은 회원에게는 적어 두는 곳을 알려 준다. */-->
<p class="help" th:if="${savedHomeArea != null}">내 정보의 '주로 출발하는 곳'을 넣어 두었어요.</p>
<p class="help">비워 두면 여행지 도착부터 일정을 짜요.</p>
<input type="hidden" name="originLongitude" disabled><input type="hidden" name="originLatitude" disabled>
<div class="form-actions"><button type="button" class="button-quiet" data-home-locate>내 위치로 찾기</button></div>
<p class="help" data-home-status>위치는 저장하지 않아요.</p>
<p><label for="returnPlace">마지막 날 돌아갈 곳 (선택)</label>
<input id="returnPlace" name="returnPlace" maxlength="60" placeholder="비워 두면 출발지로 돌아와요. 예) 대전 서구" th:value="${home.returnPlace}"></p>
</section>
</body>
</html>
