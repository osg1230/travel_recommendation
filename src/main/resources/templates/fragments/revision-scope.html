<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 수정안으로 바꿀 수 있는 범위. 서버의 수정 기능(관광지 교체·시간)과 같은 내용으로 유지한다. -->
<div class="notice" th:fragment="scope">
<p><strong>수정안으로 바꿀 수 있는 것</strong> · 관광지 교체(확인된 후보 안에서), 하루 시작·종료 시간, 관광지 체류시간, 첫날 집 출발·마지막 날 귀가 시각</p>
<p>11시 넘어 하루를 시작하면(예: 12시 넘어 도착) 첫 관광지 전에 점심부터 먹도록 자동으로 짜요.</p>
<p><strong>바꿀 수 없는 것</strong> · 식사 장소, 숙소, 여행 날짜·기간, 이동수단, 새 장소 추가. 이런 변경은 여행 조건부터 새 일정을 만들어 저장해 주세요.</p>
</div>
</body>
</html>
