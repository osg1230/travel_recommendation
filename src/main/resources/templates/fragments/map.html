<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 지도 영역. 키가 없거나 불러오기에 실패해도 아래 목록과 링크로 같은 정보를 볼 수 있다. -->
<section th:fragment="tripMap(heading, help)" class="condition-section trip-map" data-trip-map
         th:attr="data-key=${kakaoMapKey},data-map=${mapJson},data-day-paths=${dayPathsUrl}" aria-labelledby="map-title">
    <h2 id="map-title" th:text="${heading}"></h2>
    <p class="help" th:text="${help}"></p>
    <div data-map-canvas class="trip-map-canvas" hidden role="region" aria-label="지도"></div>
    <p class="help" role="status" data-map-status
       th:text="${#strings.isEmpty(kakaoMapKey) ? '지금은 지도를 보여 드릴 수 없어요. 아래 목록과 위치·길찾기 링크는 그대로 쓸 수 있어요.' : '지도를 불러오고 있어요.'}"></p>
</section>
<!-- 여러 날 일정에서 고른 날만 보여 주는 버튼(day-tabs.js). 스크립트가 없으면 숨겨 두고 모든 날을 그대로 보여 준다. -->
<div th:fragment="dayTabs(days)" th:if="${days.size() > 1}" class="day-tabs" data-day-tabs hidden role="group" aria-label="볼 날짜 고르기">
    <button type="button" class="day-tab" data-day="0">전체</button>
    <button type="button" class="day-tab" th:each="day : ${days}" th:attr="data-day=${day.number}"><span th:text="${day.number + '일차'}"></span><span class="day-tab-date" th:if="${day.date != null}" th:text="${' · ' + @timeText.day(day.date)}"></span></button>
</div>
</body>
</html>
