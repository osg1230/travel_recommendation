<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 · 여행 일정')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <p class="eyebrow">관리자</p>
    <h1>관리자 시작 화면</h1>
    <p class="intro">관리자로 로그인했어요. 관리 기능은 회원 관리와 키워드 관리뿐이에요.</p>

    <section class="card">
        <h2>회원 관리</h2>
        <p>회원을 검색하고 상세 정보를 확인하며, 상태를 정상 또는 이용 제한으로 바꿀 수 있어요.</p>
        <div class="form-actions">
            <a class="button" th:href="@{/admin/members}">회원 관리 열기 →</a>
            <a class="button button-quiet" th:href="@{/account}">내 정보</a>
        </div>
    </section>

    <section class="card">
        <h2>키워드 관리</h2>
        <p>조건 입력 화면에서 고르는 선택지의 이름·표시 순서·사용 여부를 고치고, 동행자·여행 취향 키워드를 추가할 수 있어요.</p>
        <div class="form-actions">
            <a class="button" th:href="@{/admin/keywords}">키워드 관리 열기 →</a>
        </div>
    </section>

    <p class="guide-note">여행지·관광지·숙소·음식점 데이터는 관리자가 직접 등록·수정하지 않아요. 회원 탈퇴·삭제와 키워드 삭제도 이 화면에서 하지 않아요.</p>
</main>
</body>
</html>
