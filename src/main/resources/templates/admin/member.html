<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${member.summary.loginId + ' 회원 정보 | 관리자'}">회원 정보 | 관리자</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <a class="back-link" th:href="@{/admin/members}">← 회원 목록</a>
    <h1 th:text="${member.summary.loginId}"></h1>
    <p role="status" th:if="${adminMessage != null}" th:text="${adminMessage}"></p>

    <p>닉네임 <strong th:text="${member.summary.nickname}"></strong></p>
    <p>구분 <strong th:text="${member.summary.role}"></strong></p>
    <p>현재 상태 <strong th:text="${member.summary.statusName}"></strong></p>
    <p th:text="${'가입 ' + member.summary.joinedAt + ' (UTC)'}"></p>
    <p th:text="${'최근 변경 ' + member.updatedAt + ' (UTC)'}"></p>
    <p class="help">운영에 필요한 최소 정보만 표시합니다.</p>

    <h2>상태 변경</h2>
    <p th:unless="${member.statusChangeable}" role="status" th:text="${member.statusChangeBlockReason}"></p>
    <form th:if="${member.statusChangeable}" th:action="@{/admin/members/{id}/status(id=${member.summary.id})}"
          method="post" onsubmit="return confirm('입력한 사유로 회원 상태를 바꿀까요?');">
        <div class="field">
            <label for="status">바꿀 상태 (필수)</label>
            <select id="status" name="status" required>
                <option value="ACTIVE" th:selected="${member.summary.status == 'RESTRICTED'}">정상</option>
                <option value="RESTRICTED" th:selected="${member.summary.status == 'ACTIVE'}">이용 제한</option>
            </select>
            <p class="help">이용 제한으로 바꾸면 해당 회원은 로그인할 수 없습니다. 탈퇴 처리는 이 화면에서 하지 않습니다.</p>
        </div>
        <div class="field">
            <label for="reason">변경 사유 (필수)</label>
            <textarea id="reason" name="reason" required maxlength="1000" rows="3"
                      aria-describedby="reason-help"></textarea>
            <p id="reason-help" class="help">사유는 운영 이력에 남습니다. 회원의 이메일·실명 같은 개인정보는 적지 마세요.</p>
        </div>
        <button type="submit">상태 변경</button>
    </form>

    <h2>상태 변경 이력</h2>
    <p role="status" th:if="${member.history.isEmpty()}">아직 상태를 바꾼 기록이 없습니다.</p>
    <table th:unless="${member.history.isEmpty()}">
        <caption>최근 10건</caption>
        <thead><tr><th scope="col">변경 시각 (UTC)</th><th scope="col">이전</th><th scope="col">변경 후</th>
            <th scope="col">처리자</th><th scope="col">사유</th></tr></thead>
        <tbody>
        <tr th:each="change : ${member.history}">
            <td th:text="${change.changedAt}"></td>
            <td th:text="${change.beforeStatus}"></td>
            <td th:text="${change.afterStatus}"></td>
            <td th:text="${change.adminLoginId}"></td>
            <td th:text="${change.reason}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
