<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · 여행 일정</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="account">
    <a class="back-link" th:href="@{/}">← 처음으로</a>
    <h1>로그인</h1>
    <p role="status" th:if="${param.passwordChanged}">비밀번호를 변경했습니다. 새 비밀번호로 다시 로그인해 주세요.</p>
    <p class="intro">가입한 아이디로 로그인해 주세요.</p>
    <p class="notice" role="alert" th:if="${param.error}">로그인할 수 없습니다. 아이디와 비밀번호를 확인해 주세요. 이용 제한 또는 탈퇴한 계정은 로그인할 수 없습니다.</p>
    <p class="notice" role="alert" th:if="${param.unavailable}">일시적으로 로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.</p>
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="loginId">아이디</label>
            <input id="loginId" name="loginId" type="text" autocomplete="username" required maxlength="50">
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="64">
        </div>
        <button type="submit">로그인</button>
    </form>
    <p class="help">아직 계정이 없나요? <a th:href="@{/signup}">회원가입</a></p>
</main>
</body>
</html>
