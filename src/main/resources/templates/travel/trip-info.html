<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('여행 정보 | 다녀올게')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="travel">
<nav th:replace="~{fragments/layout :: flowSteps(5)}"></nav>
<a class="back-link" th:href="@{/travel/recommendations/{id}(id=${options.recommendationId})}">← 추천 결과</a>
<p class="eyebrow">여행 준비 · 여행 정보</p>
<h1 th:text="${options.places.destination.name + ' 일정을 만들기 전에 알려 주세요'}"></h1>
<!--/* 추천 조건에 없는 값과 집 출발·귀가만 묻는다. 하루 시간·체류시간·장소는 기본값으로 만들고 초안에서 바꾼다. */-->
<p class="intro">일정을 짜려면 아래 정보가 필요해요.</p>
<p role="alert" th:if="${values.error != null}" th:text="${values.error}"></p>
<form method="post" th:action="@{/travel/recommendations/{id}/destinations/{dest}/quick-schedule(id=${options.recommendationId},dest=${options.places.destination.placeId})}" data-submit-loading="일정 초안 만드는 중…">
<!--/* 추천 조건에 일수·숙박·출발일·이동수단이 모두 있으면 빈 칸이 되므로 이 묶음은 숨기고 집 출발·귀가만 묻는다. */-->
<section class="condition-section" th:if="${options.conditions.durationDays == null or options.conditions.accommodationNeeded == null or options.conditions.startDate == null or askTransport}">
<!--/* 선택지가 적은 항목은 조건 입력 화면과 같은 버튼 모양(choice-chips)으로 보여 준다. 전송되는 이름과 값은 목록 상자일 때와 같다. */-->
<fieldset class="choice-chips condition-block" th:if="${options.conditions.durationDays == null}">
<legend>여행 일수 (필수)</legend>
<label th:each="n : ${#numbers.sequence(1,7)}"><input type="radio" name="durationDays" th:value="${n}" th:checked="${values.durationDays == n}" required><span th:text="${n == 1 ? '당일' : (n - 1) + '박 ' + n + '일'}"></span></label>
</fieldset>
<fieldset class="choice-chips condition-block" th:if="${options.conditions.accommodationNeeded == null and (options.conditions.durationDays == null or options.conditions.durationDays > 1)}">
<legend th:text="${options.conditions.durationDays == null ? '숙소가 필요한가요? (당일이면 고르지 않아도 돼요)' : '숙소가 필요한가요? (필수)'}"></legend>
<label><input type="radio" name="accommodationNeeded" value="true" th:checked="${values.accommodationNeeded == true}" th:required="${options.conditions.durationDays != null}"><span>숙소 포함</span></label>
<label><input type="radio" name="accommodationNeeded" value="false" th:checked="${values.accommodationNeeded == false}"><span>숙소는 따로 정할게요</span></label>
</fieldset>
<p class="condition-block" th:if="${options.conditions.startDate == null}"><label for="startDate">출발일 (필수)</label>
<input id="startDate" name="startDate" type="date" required th:min="${@timeText.today()}" th:value="${values.startDate != null ? values.startDate : festivalDate}"></p>
<p class="notice" th:if="${options.conditions.startDate == null and festival != null}" th:text="${festival.title + '(' + festival.period() + ') 기간에 맞춰 출발일을 넣어 두었어요. 다른 날로 바꿔도 돼요. 축제 장소는 일정에 자동으로 넣지 않아요. 넣으려면 초안 화면의 시간·조건 자세히 정해서 다시 만들기에서 고를 수 있어요.'}"></p>
<p class="help" th:if="${options.conditions.startDate == null}">날짜가 있어야 장소별 휴무일을 확인하고 내 일정으로 저장할 수 있어요.</p>
<fieldset class="choice-chips condition-block" th:if="${askTransport}">
<legend>이동수단 (필수)</legend>
<label><input type="radio" name="transport" value="CAR" th:checked="${values.transport != null and values.transport.name() == 'CAR'}" required><span>자동차</span></label>
<label><input type="radio" name="transport" value="PUBLIC_TRANSIT" th:checked="${values.transport != null and values.transport.name() == 'PUBLIC_TRANSIT'}"><span>대중교통</span></label>
</fieldset>
<p class="help" th:if="${askTransport}">자동차와 대중교통은 이동시간과 동선이 달라서 직접 골라 주세요.</p>
</section>
<section th:replace="~{fragments/home-trip :: fields(${values.home})}"></section>
<div class="form-actions"><button type="submit">일정 만들기</button>
<a class="button button-quiet" th:href="@{/travel/recommendations/{id}/destinations/{dest}/schedule(id=${options.recommendationId},dest=${options.places.destination.placeId})}">시간·조건 자세히 정하고 만들기</a></div>
</form>
<script defer th:src="@{/js/home-trip.js}"></script>
<script defer th:src="@{/js/submit-loading.js}"></script>
</main></body></html>
