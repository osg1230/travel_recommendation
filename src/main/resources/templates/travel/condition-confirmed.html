<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>여행 조건 확정 | 다녀올게</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="travel confirmation" th:object="${conditions}">
<nav th:replace="~{fragments/layout :: flowSteps(2)}"></nav>
    <p class="eyebrow">여행 준비 · 조건 확정</p><h1>여행 조건을 확정했어요</h1>
    <p class="intro">확정한 조건으로 여행지 후보를 찾아보세요. 전국 시·도의 주요 관광 도시 중에서 찾아요.</p>
    <dl class="condition-summary">
        <dt>지역</dt><dd th:text="*{region.isEmpty() ? '상관없음' : region}"></dd>
        <dt>여행 날짜</dt><dd th:text="*{startDate == null ? '아직 미정' : startDate + ' ~ ' + endDate}"></dd>
        <dt>여행 일수</dt><dd th:text="*{durationDays == null ? '아직 미정' : durationDays + '일'}"></dd>
        <dt>계절</dt><dd th:text="*{keywordNames('SEASON').isEmpty() ? '상관없음' : keywordNames('SEASON')}"></dd>
        <dt>동행자</dt><dd th:text="*{keywordNames('COMPANION').isEmpty() ? '상관없음' : keywordNames('COMPANION')}"></dd>
        <dt>여행 취향</dt><dd th:text="*{keywordNames('THEME').isEmpty() ? '상관없음' : keywordNames('THEME')}"></dd>
        <dt>이동수단</dt><dd th:text="*{keywordNames('TRANSPORTATION').isEmpty() ? '상관없음' : keywordNames('TRANSPORTATION')}"></dd>
        <dt>전체 인원</dt><dd th:text="*{partySize == null ? '아직 미정' : partySize + '명'}"></dd>
        <dt>전체 예산</dt><dd th:text="*{budget == null ? '상관없음' : budget + '원'}"></dd>
        <dt>숙박</dt><dd th:text="*{accommodationNeeded == null ? '아직 미정' : (accommodationNeeded ? '필요' : '불필요')}"></dd>
        <dt>주변 지역</dt><dd th:text="*{includeNearby == null ? '아직 미정' : (includeNearby ? '포함' : '선택 지역 중심')}"></dd>
    </dl>
    <form th:action="@{/travel/recommendations}" method="post" data-recommendation-form>
        <input type="hidden" name="confirmationToken" th:value="${confirmationToken}">
        <button class="button" type="submit">여행지 후보 찾기</button>
        <p role="status" data-submit-status></p>
    </form>
    <div class="form-actions"><a class="home-link" th:href="@{/travel/conditions/review}">확정 조건 수정하기</a><a class="home-link" th:href="@{/}">홈으로</a></div>
    <p class="help">로그아웃하거나 세션이 만료되면 조건이 사라져요.</p>
</main><script defer th:src="@{/js/recommendation-job.js}"></script></body></html>
