<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>장소 조회 안내 | 다녀올게</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="travel">
    <h1>장소를 조회할 수 없어요</h1>
    <p class="intro" role="alert" th:text="${message}"></p>
    <p th:if="${jobId != null}"><a th:href="@{/travel/recommendations/{id}(id=${jobId})}">추천 결과로 돌아가기</a></p>
    <a th:href="@{/travel/conditions}">여행 조건 다시 입력하기</a>
</main></body></html>
