<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>찾은 여행 취향 | 다녀올게</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/travel-analysis.js}"></script>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="travel">
<nav th:replace="~{fragments/layout :: flowSteps(1)}"></nav>
    <a class="back-link" th:href="@{/travel/conditions/discover(step=${lastStep})}">← 선택 다시 고르기</a>
    <p class="eyebrow">여행 준비 · 취향 찾기 결과</p>
    <h1>이번 여행에서 끌리는 취향이에요</h1>
    <p class="help" th:text="${'답한 질문 ' + result.answered + '개 · 건너뛴 질문 ' + result.skipped + '개'}"></p>

    <!-- 직접 고른 취향과 탐색 결과가 다를 때: 오류가 아니라 선택이므로, 안내 바로 아래에서 반영 방법을 고르게 한다. -->
    <form class="condition-section" method="post" th:action="@{/travel/conditions/discover/apply}" th:if="${existingNames != null}">
        <h2>어떻게 반영할까요?</h2>
        <p th:text="${'조건 입력에서 직접 고른 여행 취향(' + (existingNames.isEmpty() ? '없음' : #strings.listJoin(existingNames, ', ')) + ')과 취향 찾기 결과(' + (chosenNames.isEmpty() ? '없음' : #strings.listJoin(chosenNames, ', ')) + ')가 달라요.'}"></p>
        <fieldset class="theme-choices">
            <legend>취향 찾기 결과에서 반영할 여행 취향</legend>
            <label th:each="t : ${themes}"><input type="checkbox" name="themes" th:value="${t.selectionValue}" th:checked="${preselected.contains(t.selectionValue)}"><span th:text="${t.name}"></span></label>
        </fieldset>
        <div class="form-actions">
            <button type="submit" name="resolve" value="replace">찾은 취향으로 바꾸기</button>
            <button type="submit" name="resolve" value="merge" class="button-quiet">둘 다 반영하기</button>
            <button type="submit" name="resolve" value="keep" class="button-quiet">직접 고른 취향 유지하기</button>
        </div>
    </form>

    <section class="condition-section" th:if="${result.empty()}">
        <h2>도출된 취향이 없어요</h2>
        <p>모든 질문을 건너뛰었거나 '상관없음'을 골라서 취향을 정하지 않았어요. 임의로 취향을 만들지 않고 기존 조건 입력으로 진행해요.</p>
    </section>

    <section class="condition-section" th:if="${!result.empty()}">
        <h2>도출된 취향과 근거</h2>
        <article class="place-row" th:each="p : ${result.preferences}">
            <h3 th:text="${p.name + ' · ' + p.score + '점'}"></h3>
            <ul class="help"><li th:each="r : ${p.reasons}" th:text="${'고른 장면: ' + r}"></li></ul>
        </article>
    </section>

    <!-- 바로 추천받기: 홈의 문장 입력과 같은 요청(/travel/conditions/recommend)으로 보내 AI가 문장을 분석하고 여행지를 추천한다. -->
    <form class="condition-section" method="post" th:action="@{/travel/conditions/recommend}" th:if="${existingNames == null}" data-analysis-form>
        <h2>이 취향으로 바로 추천받기</h2>
        <p class="help" th:text="${#temporals.format(tripSaturday, 'M월 d일') + ' 토요일 출발 1박 2일로 문장을 만들었어요. 고쳐서 보내도 돼요.'}"></p>
        <input type="hidden" name="inputMode" value="TEXT">
        <input type="hidden" name="inputToken" th:value="${inputToken}">
        <label for="originalText">AI에게 보낼 문장</label>
        <textarea id="originalText" name="originalText" rows="4" maxlength="2000" required th:text="${tripSentence}"></textarea>
        <div class="form-actions"><button type="submit">이 문장으로 바로 추천받기</button></div>
        <p class="help" role="status" data-analysis-status hidden>문장을 분석하고 여행지를 찾고 있어요. 10초쯤 걸릴 수 있어요.</p>
    </form>

    <form class="condition-section" method="post" th:action="@{/travel/conditions/discover/apply}" th:if="${existingNames == null}">
        <h2>조건을 직접 고르고 싶다면</h2>
        <fieldset class="theme-choices">
            <legend>조건 입력에 반영할 여행 취향</legend>
            <label th:each="t : ${themes}"><input type="checkbox" name="themes" th:value="${t.selectionValue}" th:checked="${preselected.contains(t.selectionValue)}"><span th:text="${t.name}"></span></label>
        </fieldset>
        <div class="form-actions">
            <button type="submit" class="button-quiet">이 취향으로 조건 직접 고르기</button>
        </div>
    </form>
    <form method="post" th:action="@{/travel/conditions/discover/reset}">
        <div class="form-actions"><button type="submit" class="button-quiet">처음부터 다시 찾기</button></div>
    </form>
</main>
</body>
</html>
