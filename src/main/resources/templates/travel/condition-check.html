<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>입력 내용 확인 | 다녀올게</title><link rel="stylesheet" th:href="@{/css/app.css}"><script defer th:src="@{/js/travel-analysis.js}"></script></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="travel confirmation" th:object="${travelForm}">
<nav th:replace="~{fragments/layout :: flowSteps(2)}"></nav>
    <p class="eyebrow">여행 준비 · 입력 내용 확인</p>
    <h1>입력한 내용을 확인해 주세요</h1>
    <p class="intro">바꾸고 싶은 내용이 있다면 돌아가서 수정할 수 있어요.</p>
    <p th:if="${analysisError}" class="notice" role="alert" th:text="${analysisError}"></p>
    <section th:if="*{inputMode == 'TEXT'}"><h2>적어 주신 여행 이야기</h2><p class="travel-story" th:text="*{originalText}"></p>
        <form th:action="@{/travel/conditions/analyze}" method="post" data-analysis-form>
            <input type="hidden" name="draftId" th:value="*{draftId}">
            <button type="submit">문장 분석하기</button>
            <p data-analysis-status role="status" aria-live="polite" hidden>문장에서 여행 조건을 찾고 있어요. 최대 30초 정도 걸릴 수 있어요.</p>
        </form>
    </section>
    <section th:if="*{inputMode == 'KEYWORD'}">
        <h2>선택한 여행 조건</h2>
        <dl class="condition-summary">
            <dt>지역</dt><dd th:text="*{getKeywordNames('REGION').isEmpty() ? '상관없음' : getKeywordNames('REGION')}"></dd>
            <dt>여행 날짜</dt><dd th:text="*{startDate.isEmpty() ? '상관없음' : startDate + ' ~ ' + endDate}"></dd>
            <dt>여행 일수</dt><dd th:text="*{durationDays.isEmpty() ? '상관없음' : durationDays + '일'}"></dd>
            <dt>계절</dt><dd th:text="*{getKeywordNames('SEASON').isEmpty() ? '상관없음' : getKeywordNames('SEASON')}"></dd>
            <dt>동행자</dt><dd th:text="*{getKeywordNames('COMPANION').isEmpty() ? '상관없음' : getKeywordNames('COMPANION')}"></dd>
            <dt>여행 취향</dt><dd th:text="*{getKeywordNames('THEME').isEmpty() ? '상관없음' : getKeywordNames('THEME')}"></dd>
            <dt>여행 분위기</dt><dd th:text="*{getKeywordNames('MOOD').isEmpty() ? '상관없음' : getKeywordNames('MOOD')}"></dd>
            <dt>여행 속도</dt><dd th:text="*{getKeywordNames('PACE').isEmpty() ? '상관없음' : getKeywordNames('PACE')}"></dd>
            <dt>전체 예산</dt><dd th:text="*{budget.isEmpty() ? '상관없음' : budget + '원'}"></dd>
            <dt>이동수단</dt><dd th:text="*{getKeywordNames('TRANSPORTATION').isEmpty() ? '상관없음' : getKeywordNames('TRANSPORTATION')}"></dd>
        </dl>
        <p class="help" th:if="${discoveredThemes != null and !discoveredThemes.isEmpty()}"
           th:text="${'취향 탐색에서 고른 취향: ' + #strings.listJoin(discoveredThemes, ', ') + ''}"></p>
        <a class="button" th:href="@{/travel/conditions/review}">조건 보완·확정하기</a>
    </section>
    <div class="form-actions"><a class="button" th:href="@{/travel/conditions}">입력 내용 수정하기</a><a class="home-link" th:href="@{/}">홈으로</a></div>
</main>
</body></html>
