<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 일정 | 국내여행</title>
    <link rel="stylesheet" th:href="@{/css/account.css}"><link rel="stylesheet" th:href="@{/css/travel.css}">
</head>
<body>
<header class="site-header"><a th:href="@{/}">국내여행</a></header>
<main class="travel">
    <a class="back-link" th:href="@{/}">← 처음으로</a>
    <p class="eyebrow">내 여행 · 저장한 일정</p>
    <h1>내 일정</h1>
    <p class="intro">저장한 일정은 만료되지 않아요. 저장할 때의 시각·장소·순서를 그대로 보관해요.</p>
    <p role="status" th:if="${savedMessage != null}" th:text="${savedMessage}"></p>
    <p role="status" th:if="${itineraries.isEmpty()}">아직 저장한 일정이 없어요. 여행 조건을 입력하고 만든 일정 초안에서 저장할 수 있어요.</p>
    <p th:if="${itineraries.isEmpty()}"><a th:href="@{/travel/conditions}">여행 조건 입력하고 일정 만들기 →</a></p>
    <article class="place-row" th:each="itinerary : ${itineraries}">
        <h2><a th:href="@{/my/itineraries/{id}(id=${itinerary.id})}" th:text="${itinerary.title}"></a></h2>
        <p th:text="${itinerary.destination + ' · ' + itinerary.startDate + ' ~ ' + itinerary.endDate + ' (' + itinerary.dayCount + '일)'}"></p>
        <p class="help" th:text="${'저장: ' + itinerary.savedAt + ' (UTC)'}"></p>
    </article>
    <p class="help">영업시간·휴무일·예산·예약 가능 여부는 저장 이후에도 확인이 필요해요. 방문 전 각 장소의 출처에서 다시 확인해 주세요.</p>
</main>
</body>
</html>
