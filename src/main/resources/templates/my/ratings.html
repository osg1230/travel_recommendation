<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 평가 | 다녀올게</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="travel my-page">
    <nav th:replace="~{fragments/layout :: myNav('ratings')}"></nav>
    <p class="eyebrow">내 여행 · 장소 평가</p>
    <h1>내 평가</h1>
    <p class="intro">내가 별점을 남긴 장소예요. 최근에 바꾼 순서로 보여 줘요.</p>
    <p role="status" class="status-ok" th:if="${savedMessage != null}" th:text="${savedMessage}"></p>
    <p role="status" th:if="${ratings.isEmpty()}">아직 평가한 장소가 없어요. 저장한 일정에서 다녀온 장소를 평가할 수 있어요.</p>
    <p th:if="${ratings.isEmpty()}"><a th:href="@{/my/itineraries}">저장한 일정 보러 가기 →</a></p>
    <article class="place-row" th:each="r : ${ratings}">
        <p class="help"><span class="type-chip" th:text="${r.place.typeName}"></span></p>
        <h2><a th:href="@{/my/ratings/{id}(id=${r.place.placeId})}" th:text="${r.place.name}"></a></h2>
        <p class="rating-stars" th:attr="aria-label=${'별점 ' + r.score + '점'}">
            <span aria-hidden="true" th:text="${#strings.repeat('★', r.score) + #strings.repeat('☆', 5 - r.score)}"></span>
            <span th:text="${r.score + '점'}"></span></p>
        <p th:if="${!r.tags.isEmpty()}" th:text="${#strings.listJoin(r.tags, ' · ')}"></p>
        <p class="rating-comment" th:if="${r.comment != null}" th:text="${r.comment}"></p>
        <p class="help" th:text="${'최근 수정: ' + @timeText.dateTime(r.updatedAt)}"></p>
        <!--/* 더 이상 확인되지 않는 장소는 평가를 바꿀 수 없고 삭제만 할 수 있다. */-->
        <p class="notice" th:unless="${r.place.active}">이 장소는 지금 확인되지 않아요. 평가는 바꿀 수 없고 장소 이름을 눌러 삭제할 수 있어요.</p>
        <!--/* 목록에서 장소 위치를 바로 다시 볼 수 있게 한다. */-->
        <div class="place-links">
            <a th:href="${r.place.mapUrl}" target="_blank" rel="noopener noreferrer">위치 보기<span class="visually-hidden"> (새 창)</span></a>
            <a th:if="${!#strings.isEmpty(r.place.sourceUrl)}" th:href="${r.place.sourceUrl}" target="_blank" rel="noopener noreferrer">출처<span class="visually-hidden"> 확인 (새 창)</span></a>
        </div>
    </article>
</main>
</body>
</html>
