# Local Windows development only. Override DB_URL for another PC or SQL port.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=travel_recommendation;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true}
# Use the Windows account running Java, even if SQL login variables are set.
spring.datasource.username=
