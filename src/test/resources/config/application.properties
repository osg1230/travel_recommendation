# 테스트 전용 설정. Spring Boot는 classpath:/config/application.properties를 기본 설정(application.properties) 위에 더해 읽는다.
# 여러 테스트가 같은 IP(127.0.0.1)로 추천을 요청해 시간당 요청 제한(AiRequestLimiter)에 걸리지 않게 테스트에서만 끈다.
# 요청 제한 자체는 AiRequestLimiterTests에서, 제한에 걸렸을 때의 화면은 DirectRecommendationFlowTests(가짜 제한)에서 확인한다.
travel.ai.request-limit.enabled=false
# 로그인·가입 횟수 제한도 같은 이유로 끈다. 제한 자체는 LoginAttemptLimiterTests·LoginLimitControllerTests에서 확인한다.
travel.login-limit.enabled=false
# 키가 있는 PC에서도 테스트가 실제 외부 API를 부르지 않게 비운다. 실제 호출이 필요한 Live·품질 보고서 테스트만 @SpringBootTest에서 키를 되살린다.
travel.openai.api-key=
travel.kakao.rest-api-key=
travel.tourapi.service-key=
travel.tago.service-key=
travel.verification.auto=false
# 어디서 실행하든(mvn·VS Code) 같은 DB의 대기 작업을 테스트가 가져가거나 처리 중 작업을 실패로 바꾸지 않게 실행기를 끈다.
travel.jobs.enabled=false
