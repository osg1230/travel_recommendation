# 테스트 전용 설정. Spring Boot는 classpath:/config/application.properties를 기본 설정(application.properties) 위에 더해 읽는다.
# 여러 테스트가 같은 IP(127.0.0.1)로 추천을 요청해 시간당 요청 제한(AiRequestLimiter)에 걸리지 않게 테스트에서만 끈다.
# 요청 제한 자체는 AiRequestLimiterTests에서, 제한에 걸렸을 때의 화면은 DirectRecommendationFlowTests(가짜 제한)에서 확인한다.
travel.ai.request-limit.enabled=false
